# EnvRune Cloud's API and panel. The database and the sign-in are Supabase,
# which runs from its own Compose file or as a hosted project;
# docs/self-hosting.md walks through both.
#
#   cp .env.example .env    # then fill it in
#   docker compose up -d --build

services:
  web:
    build: ./web
    image: envrune-cloud
    restart: unless-stopped
    # Reachable from this machine only: put a reverse proxy with HTTPS in
    # front of it. The CLI refuses a server without HTTPS.
    ports:
      - "127.0.0.1:${ENVRUNE_CLOUD_PORT:-3000}:3000"
    environment:
      NEXT_PUBLIC_SUPABASE_URL: ${NEXT_PUBLIC_SUPABASE_URL:?set it in .env}
      NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: ${NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY:?set it in .env}
      SUPABASE_SECRET_KEY: ${SUPABASE_SECRET_KEY:?set it in .env}
      ENVRUNE_PROXY_IDENTITY: ${ENVRUNE_PROXY_IDENTITY:-}
