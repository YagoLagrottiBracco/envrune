# A monorepo with a FastAPI API, a NestJS backend, and a Next.js front end.
# Values live in the vault; this file only names them.
version: 1
project: shop
default_env: development

# What each variable is and how to get it; `envrune setup` walks a new
# developer through them, and commands refuse values that do not fit.
variables:
  DATABASE_URL:
    description: Postgres database shared by the API and the backend
    how_to_get: Run `docker compose up db` for a local one
    type: url
    format: ^postgres(ql)?://
  STRIPE_KEY:
    description: Stripe secret key
    how_to_get: Stripe dashboard, Developers, API keys
    format: ^sk_(test|live)_
  JWT_SECRET:
    description: Signs session tokens; generate one with `envrune generate`

commands:
  api:
    run: .venv/bin/python -m uvicorn main:app --reload --port 8000
    dir: api
  backend:
    run: npm run start:dev
    dir: backend
  web:
    run: npm run dev
    dir: web
  stack: docker compose up

# `envrune up` starts these together with one unlock.
up: [api, backend, web]

environments:
  development:
    DATABASE_URL: shop.database-url.development
    STRIPE_KEY: team.stripe.test-key # shared through envrune.team.json
    JWT_SECRET: shop.jwt-secret.development
  production:
    DATABASE_URL: shop.database-url.production
    STRIPE_KEY: shop.stripe.live-key
    JWT_SECRET: shop.jwt-secret.production
