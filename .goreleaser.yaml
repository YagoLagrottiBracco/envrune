version: 2

project_name: envrune

before:
  hooks:
    - go test ./...

builds:
  - id: envrune
    main: ./cmd/envrune
    binary: envrune
    env:
      - CGO_ENABLED=0
    flags:
      - -trimpath
    ldflags:
      - -s -w
    goos:
      - linux
      - darwin
      - windows
    goarch:
      - amd64
      - arm64

archives:
  - id: envrune
    name_template: >-
      {{ .ProjectName }}_{{ .Version }}_{{ if eq .Os "darwin" }}macos{{ else }}{{ .Os }}{{ end }}_{{ .Arch }}
    formats: [tar.gz]
    format_overrides:
      - goos: windows
        formats: [zip]
    files:
      - LICENSE
      - README.md

nfpms:
  - id: envrune
    package_name: envrune
    file_name_template: "{{ .ProjectName }}_{{ .Version }}_linux_{{ .Arch }}"
    vendor: Yago Lagrotti Bracco
    maintainer: Yago Lagrotti Bracco
    homepage: https://github.com/YagoLagrottiBracco/envrune
    description: A deliberate command-line workspace for encrypted environment variables.
    license: Apache-2.0
    formats:
      - deb
      - rpm
    bindir: /usr/bin

# Package-manager manifests are pushed to their own repositories with the
# PACKAGES_TOKEN secret (a token with contents:write on both repositories).
# Without it, they are generated into dist/ and not pushed.
homebrew_casks:
  - name: envrune
    repository:
      owner: YagoLagrottiBracco
      name: homebrew-tap
      token: '{{ index .Env "PACKAGES_TOKEN" }}'
    skip_upload: '{{ if index .Env "PACKAGES_TOKEN" }}auto{{ else }}true{{ end }}'
    homepage: https://github.com/YagoLagrottiBracco/envrune
    description: A deliberate command-line workspace for encrypted environment variables.
    license: Apache-2.0
    binaries: [envrune]
    hooks:
      post:
        # The binary is not notarized yet; without this, macOS refuses to run it.
        install: |
          if OS.mac?
            system_command "/usr/bin/xattr", args: ["-dr", "com.apple.quarantine", "#{staged_path}/envrune"]
          end

scoops:
  - name: envrune
    repository:
      owner: YagoLagrottiBracco
      name: scoop-bucket
      token: '{{ index .Env "PACKAGES_TOKEN" }}'
    skip_upload: '{{ if index .Env "PACKAGES_TOKEN" }}auto{{ else }}true{{ end }}'
    homepage: https://github.com/YagoLagrottiBracco/envrune
    description: A deliberate command-line workspace for encrypted environment variables.
    license: Apache-2.0

checksum:
  name_template: "checksums.txt"

changelog:
  sort: asc
  filters:
    exclude:
      - "^docs:"
      - "^chore:"
      - "^test:"

release:
  github:
    owner: YagoLagrottiBracco
    name: envrune
  # The workflow adds the macOS and Windows installers, then publishes the
  # release and marks it as latest.
  draft: true
  replace_existing_draft: true
  prerelease: auto
  header: |
    **EnvRune {{ .Tag }}**: encrypted environment variables from the command line.

    ## Download

    | Platform | Installer | Portable |
    | --- | --- | --- |
    | Windows (x64 and ARM64) | [Setup (.exe)](https://github.com/YagoLagrottiBracco/envrune/releases/download/{{ .Tag }}/envrune_{{ .Version }}_windows_setup.exe) | [zip x64](https://github.com/YagoLagrottiBracco/envrune/releases/download/{{ .Tag }}/envrune_{{ .Version }}_windows_amd64.zip) · [zip ARM64](https://github.com/YagoLagrottiBracco/envrune/releases/download/{{ .Tag }}/envrune_{{ .Version }}_windows_arm64.zip) |
    | macOS (Apple Silicon and Intel) | [Installer (.pkg)](https://github.com/YagoLagrottiBracco/envrune/releases/download/{{ .Tag }}/envrune_{{ .Version }}_macos_universal.pkg) | [tar.gz Apple Silicon](https://github.com/YagoLagrottiBracco/envrune/releases/download/{{ .Tag }}/envrune_{{ .Version }}_macos_arm64.tar.gz) · [tar.gz Intel](https://github.com/YagoLagrottiBracco/envrune/releases/download/{{ .Tag }}/envrune_{{ .Version }}_macos_amd64.tar.gz) |
    | Linux x64 | [deb](https://github.com/YagoLagrottiBracco/envrune/releases/download/{{ .Tag }}/envrune_{{ .Version }}_linux_amd64.deb) · [rpm](https://github.com/YagoLagrottiBracco/envrune/releases/download/{{ .Tag }}/envrune_{{ .Version }}_linux_amd64.rpm) | [tar.gz](https://github.com/YagoLagrottiBracco/envrune/releases/download/{{ .Tag }}/envrune_{{ .Version }}_linux_amd64.tar.gz) |
    | Linux ARM64 | [deb](https://github.com/YagoLagrottiBracco/envrune/releases/download/{{ .Tag }}/envrune_{{ .Version }}_linux_arm64.deb) · [rpm](https://github.com/YagoLagrottiBracco/envrune/releases/download/{{ .Tag }}/envrune_{{ .Version }}_linux_arm64.rpm) | [tar.gz](https://github.com/YagoLagrottiBracco/envrune/releases/download/{{ .Tag }}/envrune_{{ .Version }}_linux_arm64.tar.gz) |

    **One-line install (macOS and Linux):**

    ```sh
    curl -fsSL https://raw.githubusercontent.com/YagoLagrottiBracco/envrune/main/install.sh | sh
    ```

    **After installing**, open a new terminal and run `envrune` to create your vault.

    **Installer trust:** the installers are not code-signed yet. Windows
    SmartScreen may show "Windows protected your PC": choose **More info →
    Run anyway**. On macOS, if the `.pkg` is blocked, open **System Settings →
    Privacy & Security** and choose **Open Anyway**. Every file is listed in
    `checksums.txt` so you can verify the download.
