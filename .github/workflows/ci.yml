name: ci

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Unit tests, vet, and the CLI integration suite, which runs the real
  # binary with child processes, on each system EnvRune ships for.
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Vet
        run: go vet -tags integration ./...

      - name: Unit tests
        run: go test -count=1 ./...

      - name: CLI integration tests
        run: go test -tags integration -count=1 -v ./test/integration

  # The other systems Go can target must at least compile.
  cross-compile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Build
        run: |
          for target in linux/arm64 darwin/amd64 windows/arm64 freebsd/amd64; do
            GOOS="${target%/*}" GOARCH="${target#*/}" go build -o /dev/null ./cmd/envrune
          done
