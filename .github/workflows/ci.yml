name: ci

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Unit tests, vet, and the CLI integration suite, which runs the real
  # binary with child processes, on each system EnvRune ships for.
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Vet
        run: go vet -tags integration ./...

      - name: Unit tests
        run: go test -count=1 ./...

      - name: CLI integration tests
        run: go test -tags integration -count=1 -v ./test/integration

  # The other systems Go can target must at least compile.
  cross-compile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Build
        run: |
          for target in linux/arm64 darwin/amd64 windows/arm64 freebsd/amd64; do
            GOOS="${target%/*}" GOARCH="${target#*/}" go build -o /dev/null ./cmd/envrune
          done

  # The envrune packages for Node and Python.
  packages:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Node package
        working-directory: packages/node
        run: npm test

      - name: Python package
        working-directory: packages/python
        run: python -m unittest discover -s tests -v

      - name: VS Code extension unit tests
        working-directory: packages/vscode
        run: npm test

  # Runs the VS Code extension in a real VS Code against a real vault.
  vscode:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Build envrune
        run: go build -o "$RUNNER_TEMP/envrune" ./cmd/envrune

      - name: End-to-end test
        working-directory: packages/vscode
        run: |
          npm install --no-save --no-package-lock @vscode/test-electron
          xvfb-run -a node test-e2e/run.js "$RUNNER_TEMP/envrune"

  # EnvRune Cloud: the database schema and its access rules.
  cloud-database:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: cloud
    steps:
      - uses: actions/checkout@v4

      - uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Start Postgres with the migrations
        run: supabase db start

      - name: Access-rule tests
        run: supabase test db

  # EnvRune Cloud: the API and the panel, and the image self-hosters build.
  cloud-web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: cloud/web
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - run: npm ci

      - name: Lint
        run: npm run lint

      - name: Unit tests
        run: npm test

      - name: Docker image
        run: |
          docker build -t envrune-cloud .
          docker run -d --name envrune-cloud -p 127.0.0.1:3000:3000 \
            -e NEXT_PUBLIC_SUPABASE_URL=http://127.0.0.1:54321 -e NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY=ci -e SUPABASE_SECRET_KEY=ci envrune-cloud
          for _ in $(seq 30); do
            curl -fs http://127.0.0.1:3000/api/v1/health && exit 0
            sleep 1
          done
          docker logs envrune-cloud
          exit 1

  # EnvRune Cloud end to end: the CLI's client against the API and the
  # database, both started on the runner.
  cloud-e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: End-to-end test
        run: cloud/e2e.sh
